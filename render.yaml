services:
  - type: web
    name: smartreturn-payhub-mock
    runtime: node
    branch: main
    autoDeployTrigger: checksPass
    plan: free
    numInstances: 1
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYHUB_TOKEN
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: SALESFORCE_CALLBACK_URL
        sync: false
      - key: SALESFORCE_CLIENT_ID
        sync: false
      - key: SALESFORCE_CLIENT_SECRET
        sync: false
      - key: SALESFORCE_REFUND_EVENTS_ENABLED
        value: "false"
      - key: SALESFORCE_LOGIN_URL
        sync: false
