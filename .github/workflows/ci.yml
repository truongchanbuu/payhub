name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run fast tests
        run: npm test
      - name: Verify real ten-second timeouts
        run: npm run test:integration
      - name: Set up Python for Blueprint validation
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate Render Blueprint against the official schema
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/blueprint-validator"
          "$RUNNER_TEMP/blueprint-validator/bin/pip" install --disable-pip-version-check 'PyYAML==6.0.3' 'jsonschema==4.26.0'
          "$RUNNER_TEMP/blueprint-validator/bin/python" - <<'PY'
          import json, urllib.request
          import yaml
          from jsonschema import Draft202012Validator
          with urllib.request.urlopen('https://render.com/schema/render.yaml.json', timeout=30) as response:
              schema = json.load(response)
          with open('render.yaml') as source:
              blueprint = yaml.safe_load(source)
          Draft202012Validator(schema).validate(blueprint)
          print('Render Blueprint is valid')
          PY
